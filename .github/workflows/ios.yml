name: iOS Build (unsigned IPA)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: |
          xcodegen generate
          echo "--- verify project ---"
          pwd && ls -la
          test -d LeleMusic.xcodeproj && echo "xcodeproj OK" || { echo "xcodeproj MISSING"; find . -maxdepth 3 -name "*.xcodeproj"; exit 1; }
          xcodebuild -project LeleMusic.xcodeproj -list

      - name: Build (unsigned, generic iOS device)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project LeleMusic.xcodeproj \
            -scheme LeleMusic \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log | tail -40

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          APP=$(find build/Build/Products -type d -name "LeleMusic.app" | head -1)
          echo "APP=$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry LeleMusic-unsigned.ipa Payload
          ls -lh LeleMusic-unsigned.ipa
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeleMusic-unsigned-ipa
          path: ios/LeleMusic-unsigned.ipa
          retention-days: 30
